name: Nicira Networks
description: 'Nicira Networks was a software-defined networking (SDN) and network
  virtualization pioneer founded in 2007 out of research by Martin Casado, Nick McKeown,
  and Scott Shenker on OpenFlow. Its Network Virtualization Platform (NVP) decoupled
  virtual networks from underlying physical hardware. VMware acquired Nicira on August
  24, 2012 for approximately $1.26 billion; the technology was folded into VMware
  vSwitch and relaunched as VMware NSX in 2013, and VMware was itself acquired by
  Broadcom in November 2023. Nicira no longer operates as an independent company and
  publishes no first-party developer portal or API. Its only historical API footprint
  is the third-party Nicira NVP plugin integrated into Apache CloudStack. Surfaced
  in the API Evangelist network as a portfolio company of a16z and Lightspeed Venture
  Partners.'
